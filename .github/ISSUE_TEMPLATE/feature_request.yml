name: Feature request
description: Suggest an idea or improvement for WandererZ (including Jobs and RPG Difficulty)
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please describe your idea below.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem is, if any. Ex. I'm always frustrated when [...]
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Which area does this affect?
      options:
        - WandererZ (core leveling/skills)
        - Jobs (integrated JobsAddon features)
        - RPG Difficulty (integrated RpgDifficulty features)
        - Both / Unsure
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context, mockups, or screenshots about the feature request here.
    validations:
      required: false
